[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "late-truth-soft-sensing"
version = "1.0.0"
description = "Fleet-level wind turbine soft sensing with late-arriving ground truth"
requires-python = ">=3.12"
authors = [{name = "Aryan Ashoori", email = "aryanashoori0@gmail.com"}]
license = "MIT"

[tool.setuptools.packages.find]
include = ["latetruth*"]

[tool.setuptools.package-data]
latetruth = ["data_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".work/pytest_cache"
